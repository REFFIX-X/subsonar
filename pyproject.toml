[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "subsonar"
dynamic = ["version"]
description = "Asynchronous subdomain and web-interface scanner"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "REFFIX-X" }]
keywords = ["subdomain", "dns", "osint", "recon", "security"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = [
    "aiohttp>=3.9,<4",
    "textual>=0.80",
    "rich>=13.7",
    "streamlit>=1.37",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
subsonar = "subsonar.cli:console_main"

[project.urls]
Homepage = "https://github.com/REFFIX-X/subsonar"
Repository = "https://github.com/REFFIX-X/subsonar"
Issues = "https://github.com/REFFIX-X/subsonar/issues"

[tool.setuptools.dynamic]
version = { attr = "subsonar.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["subsonar*"]

[tool.setuptools.package-data]
subsonar = ["data/*"]
