[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
addopts = -p no:cacheprovider -q
testpaths = tests
filterwarnings =
    # Third-party deprecations only — subsonar's own code must stay warning-free.
    ignore::DeprecationWarning:aiohttp.*
    ignore::DeprecationWarning:aiodns.*
    ignore::DeprecationWarning:pycares.*
    ignore::DeprecationWarning:streamlit.*
    ignore::DeprecationWarning:textual.*
    ignore::DeprecationWarning:rich.*
    # Emitted from inside aiodns' own use of pycares; see dns.AiodnsResolver.
    ignore:query\(\) is deprecated, use query_dns\(\) instead:DeprecationWarning
